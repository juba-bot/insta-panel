<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insta Panel">
<meta name="theme-color" content="#0f1115">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>Insta Panel</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a34;--text:#eef0f4;--mut:#8b92a1;--acc:#ff5c8a;--acc2:#ffb347;--ok:#4cd39a;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 84px)}
h1{font-size:20px;margin:0}h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px;font-weight:600}
p{margin:0 0 10px}a{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)}.small{font-size:12.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:22px;font-weight:700;letter-spacing:-.01em}
.stat span{font-size:12.5px;color:var(--mut)}
.delta{font-size:12px;font-weight:600}.up{color:var(--ok)}.down{color:var(--bad)}
.avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;background:var(--line)}
button,input,textarea{font:inherit;color:inherit}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#16090d;font-weight:700}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:500}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:8px}
textarea,.inp{width:100%;background:#0b0d11;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px}
textarea{min-height:92px;word-break:break-all}
ol{padding-left:20px;margin:6px 0 12px}li{margin-bottom:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 13px;font-size:13px;color:var(--mut)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.chip:disabled{opacity:.5}
.post{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.post:last-child{border-bottom:0}
div.post{cursor:pointer}
.tbl{display:grid;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tbl:last-child{border-bottom:0}
.thumb{width:64px;height:84px;border-radius:10px;object-fit:cover;background:var(--line);flex:none}
.cap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--mut);margin-top:4px}
.nums b{color:var(--text);font-weight:600}
.rank{font-size:12px;color:var(--acc2);font-weight:700}
.live{color:var(--ok)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.line{margin-bottom:12px}.line:last-child{margin-bottom:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(15,17,21,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;padding:9px 1px;color:var(--mut);font-size:11.5px;border-radius:10px}
nav button.on{color:var(--text);font-weight:700;background:var(--card)}
.msg{border-radius:12px;padding:11px 13px;margin:10px 0;font-size:13.5px;background:#2a1a1f;border:1px solid #5a2a36}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite;margin:60px auto 14px}
@keyframes s{to{transform:rotate(360deg)}}
svg{display:block;width:100%;height:auto}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" class="hide">
  <button data-v="ozet">Özet</button>
  <button data-v="gonderiler">İçerik</button>
  <button data-v="analiz">Analiz</button>
  <button data-v="kitle">Kitle</button>
  <button data-v="studyo">Stüdyo</button>
  <button data-v="ayarlar">Ayarlar</button>
</nav>
<script>
"use strict";
var API_IG = "https://graph.instagram.com";   // "IG..." ile başlayan anahtarlar (Instagram girişi)
var API_FB = "https://graph.facebook.com";    // "EAA..." ile başlayan anahtarlar (Unified login)
var DAY = 86400000, CACHE_V = 4;
var app = document.getElementById("app");
var nav = document.getElementById("nav");
var state = { view: "ozet", sort: "views", tab: "posts", period: 7, data: null, loading: false, error: "", needId: false, adding: false, showToken: false, atab: "koc", rsort: "skip", stErr: "", stOpen: null, speakId: null, recSid: null, audio: null, audioBusy: false, rbusy: false, rmsg: "", detail: null, backY: 0, goalEdit: false, report: false };
state.st = { tab: "uret", task: "fikir", topic: "", count: 5, dur: 30, prompt: "", title: "", kind: "Fikir", body: "" };
try { var _st = JSON.parse(localStorage.getItem("ip_st") || "null"); if (_st) Object.keys(_st).forEach(function (k) { state.st[k] = _st[k]; }); } catch (e) {}

/* ---------- küçük yardımcılar ---------- */
function store(k, v) {
  try {
    if (v === undefined) { var r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
  } catch (e) {}
  return null;
}
function h(tag, attrs, kids) {
  var el = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) {
    var v = attrs[k];
    if (v == null || v === false) return;
    if (k === "text") el.textContent = v;
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  });
  (kids || []).forEach(function (c) { if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return el;
}
function num(n) {
  if (n == null || isNaN(n)) return "–";
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(".0", "") + " Mn";
  if (n >= 1e4) return (n / 1e3).toFixed(1).replace(".0", "") + " B";
  return Math.round(n).toLocaleString("tr-TR");
}
function signed(n) { return (n > 0 ? "+" : "") + Math.round(n).toLocaleString("tr-TR"); }
function pct(n) { return n == null || !isFinite(n) ? "–" : "%" + (n * 100).toFixed(1).replace(".", ","); }
function dateStr(d) { return new Date(d).toLocaleDateString("tr-TR", { day: "numeric", month: "short" }); }
function timeStr(d) { return new Date(d).toLocaleString("tr-TR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }
function dayKey(t) { var d = new Date(t); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
function ts(m) { return new Date(m.timestamp).getTime(); }
function sum(a, f) { return a.reduce(function (s, x) { return s + (f(x) || 0); }, 0); }
function avg(a, f) { var b = a.filter(function (x) { return f(x) != null; }); return b.length ? sum(b, f) / b.length : null; }
function kindOf(m) { return m.media_product_type === "REELS" ? "Reels" : m.media_type === "CAROUSEL_ALBUM" ? "Kaydırmalı" : m.media_type === "VIDEO" ? "Video" : "Fotoğraf"; }

/* ---------- hesaplar (yalnızca bu telefonda saklanır) ---------- */
function accounts() { return store("ip_accounts") || []; }
function saveAccounts(a) { store("ip_accounts", a); }
function cur() { var a = accounts(); return a[store("ip_active") || 0] || a[0] || null; }
function setCur(patch) {
  var a = accounts(), i = Math.min(store("ip_active") || 0, a.length - 1);
  if (i < 0) return;
  Object.keys(patch).forEach(function (k) { a[i][k] = patch[k]; });
  saveAccounts(a);
}
function akey(name) { var c = cur(); return "ip_" + name + "_" + (c ? c.uid : "x"); }
function removeAccount(uid) {
  var a = accounts().filter(function (x) { return x.uid !== uid; });
  ["cache", "hist", "stories", "snap", "rhist", "saved"].forEach(function (n) { store("ip_" + n + "_" + uid, null); });
  saveAccounts(a); store("ip_active", 0);
}
// Önceki sürümden geçiş: giriş ve takipçi geçmişi korunur
(function migrate() {
  var old = store("ip_token");
  if (!old || accounts().length) return;
  var acc = { uid: "a1", token: old, igid: store("ip_igid") || null, at: store("ip_token_at") || Date.now(), username: "" };
  var c = store("ip_cache"); if (c && c.me) acc.username = c.me.username || "";
  saveAccounts([acc]);
  if (!accounts().length) return; // yazılamadıysa eskiye dokunma
  var hist = store("ip_hist"); if (hist) store("ip_hist_a1", hist);
  store("ip_active", 0);
  ["ip_token", "ip_token_at", "ip_igid", "ip_cache", "ip_hist"].forEach(function (k) { store(k, null); });
})();
function loadCache() { var d = store(akey("cache")); return d && d.v === CACHE_V ? d : null; }

/* ---------- Instagram API ---------- */
function isIG() { var c = cur(); return /^IG/.test((c && c.token) || ""); }
function api(path, params) {
  var c = cur();
  var q = Object.keys(params || {}).map(function (k) { return k + "=" + encodeURIComponent(params[k]); });
  q.push("access_token=" + encodeURIComponent(c ? c.token : ""));
  return fetch((isIG() ? API_IG : API_FB) + path + "?" + q.join("&"), { referrerPolicy: "no-referrer" }).then(function (r) {
    return r.json().then(function (j) {
      if (j && j.error) { var e = new Error(j.error.message || "API hatası"); e.code = j.error.code; throw e; }
      return j;
    });
  });
}
function soft(p) { return p.catch(function () { return null; }); }

function refreshTokenIfNeeded() {
  var c = cur();
  if (!isIG() || Date.now() - (c.at || 0) < 7 * DAY) return Promise.resolve(); // Unified login anahtarı yenilenmez
  return soft(api("/refresh_access_token", { grant_type: "ig_refresh_token" }).then(function (j) {
    if (j.access_token) setCur({ token: j.access_token, at: Date.now() });
  }));
}

// Hesabın API yolu: Instagram girişinde "/me", Unified login'de "/<hesap kimliği>"
function findRoot() {
  if (isIG()) return Promise.resolve("/me");
  var c = cur();
  if (c.igid) return Promise.resolve("/" + c.igid);
  function pick(j) {
    var a = (j && j.data) || [];
    for (var i = 0; i < a.length; i++) {
      var x = a[i].instagram_business_account || a[i];
      if (x && x.id && (a[i].instagram_business_account || x.username)) return x.id;
    }
    return null;
  }
  return soft(api("/me/assigned_instagram_accounts", { fields: "id,username" })).then(function (j) {
    return pick(j) || soft(api("/me/instagram_accounts", { fields: "id,username" })).then(pick);
  }).then(function (id) {
    return id || soft(api("/me/accounts", { fields: "instagram_business_account{id,username}" })).then(pick);
  }).then(function (id) {
    if (!id) { var e = new Error("Hesap bulunamadı"); e.code = "NOACCOUNT"; throw e; }
    setCur({ igid: id });
    return "/" + id;
  });
}

function readInsights(j) {
  var o = {};
  (j.data || []).forEach(function (d) { o[d.name] = d.values && d.values[0] ? d.values[0].value : (d.total_value ? d.total_value.value : null); });
  return o;
}
function insightsChain(id, list, start) {
  var p = Promise.reject(new Error("start"));
  list.forEach(function (metric, idx) {
    if (idx < (start || 0)) return;
    p = p.catch(function () { return api("/" + id + "/insights", { metric: metric }).then(function (j) { return { o: readInsights(j), idx: idx }; }); });
  });
  return p.catch(function () { return { o: {}, idx: null }; });
}
var M_FULL = "reach,views,saved,shares,total_interactions";
var M_REEL = M_FULL + ",ig_reels_avg_watch_time,ig_reels_video_view_total_time";
var mStat = { reel: { ok: 0, fail: 0 }, other: { ok: 0, fail: 0 } }; // yeni ölçümler hiç çalışmıyorsa kalan gönderilerde boşuna denenmez
function mediaInsights(m) {
  var reel = m.media_product_type === "REELS" || m.media_type === "VIDEO", key = reel ? "reel" : "other";
  var list = reel ? [M_REEL + ",reels_skip_rate,reposts", M_REEL, M_FULL, "reach,saved"] : [M_FULL + ",reposts", M_FULL, "reach,saved"];
  var st = mStat[key], start = !st.ok && st.fail >= 4 ? 1 : 0;
  return insightsChain(m.id, list, start).then(function (r) {
    if (!start) { if (r.idx === 0) st.ok++; else st.fail++; }
    return r.o;
  });
}
function parseOnline(j) {
  var vals = j && j.data && j.data[0] && j.data[0].values;
  if (!vals) return null;
  var sumG = [], cnt = [], any = false, days = 0, a, b;
  for (a = 0; a < 7; a++) { sumG.push([]); cnt.push([]); for (b = 0; b < 24; b++) { sumG[a].push(0); cnt[a].push(0); } }
  vals.forEach(function (v) {
    if (!v.value || typeof v.value !== "object" || !Object.keys(v.value).length) return;
    var start = new Date(v.end_time).getTime() - DAY; // kayıt, bitiş zamanından önceki 24 saati kapsar
    if (isNaN(start)) return;
    days++;
    Object.keys(v.value).forEach(function (hk) {
      var t = new Date(start + Number(hk) * 3600000);
      sumG[t.getDay()][t.getHours()] += v.value[hk] || 0; cnt[t.getDay()][t.getHours()]++;
      if (v.value[hk]) any = true;
    });
  });
  if (!any) return null;
  return { days: days, grid: sumG.map(function (r, x) { return r.map(function (v, y) { return cnt[x][y] ? v / cnt[x][y] : null; }); }) };
}
function pool(items, size, fn) {
  var i = 0, out = new Array(items.length);
  function next() {
    if (i >= items.length) return Promise.resolve();
    var n = i++;
    return fn(items[n]).then(function (r) { out[n] = r; return next(); });
  }
  var runners = [];
  for (var k = 0; k < size; k++) runners.push(next());
  return Promise.all(runners).then(function () { return out; });
}
function demoCall(root, breakdown) {
  var p = { metric: "follower_demographics", period: "lifetime", metric_type: "total_value", breakdown: breakdown };
  function read(j) {
    var t = j && j.data && j.data[0] && j.data[0].total_value;
    var r = t && t.breakdowns && t.breakdowns[0] && t.breakdowns[0].results;
    return (r || []).map(function (x) { return { k: (x.dimension_values || []).join(" "), v: x.value || 0 }; })
      .sort(function (a, b) { return b.v - a.v; });
  }
  return api(root + "/insights", p).then(read).catch(function () {
    p.timeframe = "last_30_days";
    return api(root + "/insights", p).then(read);
  }).catch(function () { return null; });
}

function loadAll() {
  var until = Math.floor(Date.now() / 1000), since = until - 28 * 86400;
  var out = { v: CACHE_V }, root = "/me", rivalNames = (cur().rivals || []).slice(0, 5);
  function tot(metric) { return soft(api(root + "/insights", { metric: metric, period: "day", metric_type: "total_value", since: since, until: until })); }
  function brk(metric) {
    return soft(api(root + "/insights", { metric: metric, period: "day", metric_type: "total_value", breakdown: "follow_type", since: since, until: until })).then(function (j) {
      var t = j && j.data && j.data[0] && j.data[0].total_value;
      if (!t) return null;
      var parts = {}, r = t.breakdowns && t.breakdowns[0] && t.breakdowns[0].results;
      (r || []).forEach(function (x) { parts[(x.dimension_values || [])[0]] = x.value; });
      return { total: t.value, parts: parts };
    });
  }
  mStat = { reel: { ok: 0, fail: 0 }, other: { ok: 0, fail: 0 } };
  return refreshTokenIfNeeded().then(findRoot).then(function (r) {
    root = r;
    return api(root, { fields: "username,name,profile_picture_url,followers_count,follows_count,media_count" });
  }).then(function (me) {
    out.me = me;
    setCur({ username: me.username || "", fresh: false });
    return Promise.all([
      api(root + "/media", { fields: "id,caption,media_type,media_product_type,thumbnail_url,media_url,permalink,timestamp,like_count,comments_count", limit: 50 }),
      soft(api(root + "/insights", { metric: "reach", period: "day", since: since, until: until })),
      tot("reach"), tot("views"), tot("accounts_engaged"), tot("total_interactions"),
      soft(api(root + "/stories", { fields: "id,media_type,thumbnail_url,media_url,permalink,timestamp" })),
      demoCall(root, "country"), demoCall(root, "city"), demoCall(root, "age"), demoCall(root, "gender"),
      brk("follows_and_unfollows"), brk("reach"), brk("views"), tot("profile_views"), tot("profile_links_taps"),
      soft(api(root + "/insights", { metric: "online_followers", period: "lifetime", since: until - 15 * 86400, until: until - 86400 }))
    ]);
  }).then(function (r) {
    out.media = (r[0].data || []);
    var series = r[1] && r[1].data && r[1].data[0] && r[1].data[0].values;
    out.reachSeries = (series || []).map(function (v) { return { t: v.end_time, v: v.value || 0 }; });
    function total(j) { return j && j.data && j.data[0] && j.data[0].total_value ? j.data[0].total_value.value : null; }
    out.totals = { reach: total(r[2]), views: total(r[3]), engaged: total(r[4]), interactions: total(r[5]) };
    out.liveStories = (r[6] && r[6].data) || [];
    out.demo = { country: r[7], city: r[8], age: r[9], gender: r[10] };
    out.online = parseOnline(r[16]);
    out.growth = { fu: r[11], reach: r[12], views: r[13], profileViews: total(r[14]), linkTaps: total(r[15]) };
    return Promise.all([
      pool(out.media, 6, mediaInsights),
      pool(out.liveStories, 4, function (s) { return insightsChain(s.id, ["reach,views,replies,shares,total_interactions", "reach,replies"]).then(function (x) { return x.o; }); }),
      pool(rivalNames, 2, function (n) { return fetchRival(root, n); })
    ]);
  }).then(function (res) {
    out.media.forEach(function (m, i) {
      var x = res[0][i] || {};
      m.reach = x.reach; m.views = x.views; m.saved = x.saved; m.shares = x.shares;
      m.watch = x.ig_reels_avg_watch_time; m.watchTotal = x.ig_reels_video_view_total_time; // milisaniye
      m.skip = x.reels_skip_rate; m.reposts = x.reposts;
      m.likes = m.like_count || 0; m.comments = m.comments_count || 0;
      m.eng = x.total_interactions != null ? x.total_interactions : m.likes + m.comments + (x.saved || 0) + (x.shares || 0);
      m.rate = m.reach ? m.eng / m.reach : null;
    });
    out.at = Date.now();

    // rakipler
    out.rivals = {};
    rivalNames.forEach(function (n, i) { out.rivals[n] = res[2][i]; saveRivalHist(n, res[2][i], out.at); });

    // gönderi gidişatı: 14 günden yeni gönderilerin görüntülenmesi her açılışta kaydedilir
    var snaps = store(akey("snap")) || {}, keep = {};
    out.media.forEach(function (m) {
      if (out.at - ts(m) > 14 * DAY && !snaps[m.id]) return;
      var list = snaps[m.id] || [], last = list[list.length - 1];
      if (m.views != null && out.at - ts(m) <= 14 * DAY && (!last || out.at - last[0] > 20 * 60000)) list.push([out.at, m.views]);
      if (list.length) keep[m.id] = list.slice(-60);
    });
    store(akey("snap"), keep);

    // hikâye arşivi: hikâyeler 24 saatte silindiği için görülenler burada saklanır
    var arch = store(akey("stories")) || [], liveIds = {};
    out.liveStories.forEach(function (s, i) {
      var x = res[1][i] || {};
      liveIds[s.id] = true;
      var rec = { id: s.id, timestamp: s.timestamp, permalink: s.permalink, video: s.media_type === "VIDEO",
        img: s.thumbnail_url || (s.media_type !== "VIDEO" ? s.media_url : null),
        reach: x.reach, views: x.views, replies: x.replies, shares: x.shares, eng: x.total_interactions, seen: out.at };
      arch = arch.filter(function (a) { return a.id !== s.id; });
      arch.push(rec);
    });
    arch.sort(function (a, b) { return ts(b) - ts(a); });
    arch = arch.slice(0, 120);
    store(akey("stories"), arch);
    out.liveIds = liveIds;
    delete out.liveStories;

    // takipçi geçmişi: her gün için bir kayıt
    var hist = store(akey("hist")) || [];
    var key = dayKey(out.at);
    hist = hist.filter(function (x) { return x.k !== key; });
    hist.push({ k: key, t: out.at, f: out.me.followers_count });
    if (hist.length > 400) hist = hist.slice(-400);
    store(akey("hist"), hist);
    store(akey("cache"), out);
    return out;
  });
}

/* ---------- grafik ve ortak parçalar ---------- */
function lineChart(points, color, withTime) {
  var W = 320, H = 110, P = 6;
  if (!points || points.length < 2) return h("p", { class: "mut small", style: "margin:0", text: "Grafik için henüz yeterli veri yok." });
  var vals = points.map(function (p) { return p.v; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max === min) { max += 1; min -= 1; }
  var xy = points.map(function (p, i) {
    return [P + i * (W - 2 * P) / (points.length - 1), H - P - (p.v - min) * (H - 2 * P) / (max - min)];
  });
  var line = xy.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  var area = document.createElementNS(ns, "polygon");
  area.setAttribute("points", P + "," + (H - P) + " " + line + " " + (W - P) + "," + (H - P));
  area.setAttribute("fill", color); area.setAttribute("opacity", ".14");
  var pl = document.createElementNS(ns, "polyline");
  pl.setAttribute("points", line); pl.setAttribute("fill", "none"); pl.setAttribute("stroke", color);
  pl.setAttribute("stroke-width", "2.2"); pl.setAttribute("stroke-linejoin", "round"); pl.setAttribute("stroke-linecap", "round");
  svg.appendChild(area); svg.appendChild(pl);
  return h("div", null, [svg, h("div", { class: "row between small mut", style: "margin-top:4px" }, [
    h("span", { text: (withTime ? timeStr : dateStr)(points[0].t) }),
    h("span", { text: "en düşük " + num(Math.min.apply(null, vals)) + " · en yüksek " + num(Math.max.apply(null, vals)) }),
    h("span", { text: (withTime ? timeStr : dateStr)(points[points.length - 1].t) })
  ])]);
}

function followerDelta(hist, days) {
  if (!hist || hist.length < 2) return null;
  var last = hist[hist.length - 1], target = last.t - days * DAY, base = null;
  for (var i = hist.length - 2; i >= 0; i--) { base = hist[i]; if (hist[i].t <= target) break; }
  if (!base || last.t - base.t < DAY / 2) return null;
  return { d: last.f - base.f, days: Math.max(1, Math.round((last.t - base.t) / DAY)) };
}

/* ---------- Haftalık rapor kartı (görsel) ---------- */
function reportStats(d, hist) {
  var days = 7, a = d.at - days * DAY, b = d.at - 2 * days * DAY;
  var now = d.media.filter(function (m) { return ts(m) >= a; });
  var prev = d.media.filter(function (m) { return ts(m) < a && ts(m) >= b; });
  var oldest = d.media.length ? Math.min.apply(null, d.media.map(ts)) : d.at;
  var prevKnown = d.media.length < 50 || oldest <= b;
  var v = sum(now, function (m) { return m.views; }), pv = sum(prev, function (m) { return m.views; });
  var fd = followerDelta(hist, days);
  var best = now.slice().sort(function (x, y) { return (y.views != null ? y.views : y.eng) - (x.views != null ? x.views : x.eng); })[0] || null;
  return { n: now.length, views: now.length ? v : null, change: prevKnown && prev.length && pv > 0 ? (v - pv) / pv : null,
    rate: avg(now, function (m) { return m.rate; }), fd: fd, best: best, from: a, to: d.at };
}

  var g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#0f1115"); g.addColorStop(1, "#1a1d26");

/* ---------- Gidişat: yeni gönderi olgun gönderilere göre nasıl gidiyor ---------- */

  var pool = same.length >= 3 ? same : mature;
  if (pool.length < 3) return null;
  var a = avg(pool, function (x) { return x.views; });

}

      state.adding = true; state.needId = e.code === "NOACCOUNT";
      state.error = e.code === "NOACCOUNT"
        ? "Anahtar kabul edildi ama bağlı Instagram hesabı kendiliğinden bulunamadı. Anahtarı yeniden yapıştır ve altındaki kutuya Instagram hesap kimliğini (Meta sayfasında hesabın yanında yazan uzun sayı) gir."
        : "Erişim anahtarı geçersiz. Meta'dan yeni bir anahtar üretip yapıştır.";
    } else if (e.code === 190) {
      state.error = "Bu hesabın erişim anahtarı geçersiz ya da süresi dolmuş. Ayarlar'dan hesabı kaldırıp yeni anahtarla tekrar ekle. Kayıtlı veriler o zamana kadar görüntülenir.";
    } else if (e.code === "NOACCOUNT") {
      state.error = "Bağlı Instagram hesabı bulunamadı. Ayarlar'dan hesabı kaldırıp yeniden ekle.";
    } else if (e instanceof TypeError) {
      state.error = "Instagram'a bağlanılamadı. İnternet bağlantını kontrol et.";
    } else {
      state.error = "Instagram hata döndürdü: " + e.message;
    }
  }).then(function () { state.loading = false; render(); });
}

nav.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  state.view = b.dataset.v; state.detail = null; state.report = false; state.goalEdit = false; render(); window.scrollTo(0, 0);
});

state.data = loadCache();
render();
if (cur() && (!state.data || Date.now() - state.data.at > 15 * 60000)) refresh();
</script>
</body>
</html>
